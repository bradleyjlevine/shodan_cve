services:
  shodan-cve-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shodan-cve-server
    ports:
      - "8088:8088"  # MCP API port
      - "8089:8089"  # Health API port
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped